name: Auto Change, PR and Merge

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows you to test it manually from Actions
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: SwayamGunjal-patch-1
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate a change
        run: |
          mkdir -p .github/automation

          echo "Last automated update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > .github/automation/last-update.txt

          git add .github/automation/last-update.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: automated update"

      - name: Push change to existing branch
        run: |
          git push origin HEAD:SwayamGunjal-patch-1

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "SwayamGunjal-patch-1" \
            --base "main" \
            --title "chore: automated update" \
            --body "Automated change generated by GitHub Actions.")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait 20 seconds
        run: sleep 20

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create_pr.outputs.pr_url }}" \
            --merge \
            --delete-branch=false
