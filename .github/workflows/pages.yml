name: Deploy ClassCrew to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Create Pages directory
      - name: Prepare website
        run: |

          mkdir -p _site

          # Copy the complete static website
          cp -r "Outlook Files" _site/

          # Copy quote data
          mkdir -p "_site/php_auth_system/data"

          cp \
            "php_auth_system/data/daily_quotes.json" \
            "_site/php_auth_system/data/daily_quotes.json"

      # Upload website artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
