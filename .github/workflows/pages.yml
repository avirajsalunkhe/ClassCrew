name: Deploy ClassCrew to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p "_site"

          cp "Outlook Files/index.html" \
             "_site/index.html"

          cp "php_auth_system/data/daily_quotes.json" \
             "_site/daily_quotes.json"

      - name: Verify Pages files
        run: |
          test -s "_site/index.html"
          test -s "_site/daily_quotes.json"

          python3 -m json.tool \
            "_site/daily_quotes.json" \
            >/dev/null

          echo "GitHub Pages artifact verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
