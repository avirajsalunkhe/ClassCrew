name: ClassCrew Quote Automation

on:
  schedule:
    - cron: "17 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: classcrew-quote-automation
  cancel-in-progress: false

env:
  QUOTES_FILE: php_auth_system/data/daily_quotes.json
  HISTORY_FILE: php_auth_system/data/quote_history.json
  PAGE_FILE: Outlook Files/index.html
  TARGET_BRANCH: main

jobs:
  quote-update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AVIRAJ_PAT }}

      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "Aviraj Salunkhe"
          git config user.email "96661930+avirajsalunkhe@users.noreply.github.com"

      # ============================================================
      # 3. CREATE DATA BRANCH
      # ============================================================

      - name: Create data branch
        run: |
          DATA_BRANCH="automation/quote-data-${{ github.run_id }}"

          echo "DATA_BRANCH=$DATA_BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$DATA_BRANCH"

      # ============================================================
      # 4. VALIDATE QUOTE DATABASE
      # ============================================================

      - name: Validate quote database
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("php_auth_system/data/daily_quotes.json")

          if not path.exists():
              raise SystemExit("daily_quotes.json does not exist.")

          try:
              quotes = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"Invalid daily_quotes.json: {exc}"
              )

          if not isinstance(quotes, list) or not quotes:
              raise SystemExit(
                  "Quote database must be a non-empty JSON array."
              )

          ids = []

          for quote in quotes:
              if not isinstance(quote, dict):
                  raise SystemExit(
                      "Every quote must be a JSON object."
                  )

              if "id" not in quote or "quote" not in quote:
                  raise SystemExit(
                      "Every quote must contain id and quote."
                  )

              ids.append(quote["id"])

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "Duplicate quote IDs found."
              )

          print(
              f"Quote database verified: {len(quotes)} quotes."
          )
          PY

      # ============================================================
      # 5. VERIFY QUOTE HISTORY
      # ============================================================

      - name: Verify quote history
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "php_auth_system/data/quote_history.json"
          )

          if not path.exists():
              path.write_text(
                  "[]\n",
                  encoding="utf-8"
              )

          try:
              history = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"Invalid quote_history.json: {exc}"
              )

          if not isinstance(history, list):
              raise SystemExit(
                  "quote_history.json must contain a JSON array."
              )

          ids = []

          for item in history:
              if not isinstance(item, dict):
                  raise SystemExit(
                      "Every history item must be a JSON object."
                  )

              if "quote_id" not in item:
                  raise SystemExit(
                      "Every history item must contain quote_id."
                  )

              ids.append(item["quote_id"])

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "Duplicate quote IDs found in quote history."
              )

          print(
              f"Quote history verified: {len(ids)} unique quotes used."
          )
          PY

      # ============================================================
      # 6. SELECT NEXT UNUSED QUOTE
      # ============================================================

      - name: Select next unused quote
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          quotes_path = Path(
              "php_auth_system/data/daily_quotes.json"
          )

          history_path = Path(
              "php_auth_system/data/quote_history.json"
          )

          quotes = json.loads(
              quotes_path.read_text(
                  encoding="utf-8"
              )
          )

          history = json.loads(
              history_path.read_text(
                  encoding="utf-8"
              )
          )

          used_ids = {
              item["quote_id"]
              for item in history
          }

          unused = [
              quote
              for quote in quotes
              if quote["id"] not in used_ids
          ]

          if not unused:
              raise SystemExit(
                  "NO_UNUSED_QUOTES: All quotes have already "
                  "been used. Add more quotes before the next execution."
              )

          selected = unused[0]

          timestamp = datetime.now(
              timezone.utc
          ).isoformat()

          history.append(
              {
                  "quote_id": selected["id"],
                  "used_at": timestamp,
                  "run_id": "${{ github.run_id }}",
                  "run_number": "${{ github.run_number }}"
              }
          )

          history_path.write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          Path(
              "/tmp/selected_quote.json"
          ).write_text(
              json.dumps(
                  {
                      "id": selected["id"],
                      "quote": selected["quote"],
                      "source": selected.get(
                          "source",
                          "ClassCrew"
                      ),
                      "used_at": timestamp
                  },
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              f"Selected quote: {selected['id']}"
          )

          print(
              selected["quote"]
          )
          PY

      # ============================================================
      # 7. EXPORT SELECTED QUOTE ID
      # ============================================================

      - name: Export selected quote ID
        run: |
          SELECTED_QUOTE_ID=$(python3 -c '
          import json
          print(
              json.load(
                  open("/tmp/selected_quote.json")
              )["id"]
          )
          ')

          echo "SELECTED_QUOTE_ID=$SELECTED_QUOTE_ID" >> "$GITHUB_ENV"

          echo "Selected quote ID: $SELECTED_QUOTE_ID"

      # ============================================================
      # 8. VERIFY SELECTION
      # ============================================================

      - name: Verify selected quote
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          selected = json.loads(
              Path(
                  "/tmp/selected_quote.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          history = json.loads(
              Path(
                  "php_auth_system/data/quote_history.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          matches = [
              item
              for item in history
              if item["quote_id"] == selected["id"]
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Quote history verification failed."
              )

          print(
              "Selection verification passed."
          )

          print(
              f"Quote ID: {selected['id']}"
          )
          PY

      # ============================================================
      # 9. CREATE ISSUE #1
      # ============================================================

      - name: Create Issue 1
        id: issue1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          ISSUE1_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Quote rotation data update - run ${{ github.run_number }}" \
            --body "Quote rotation data update. Selected quote: ${SELECTED_QUOTE_ID}. The quote was checked against quote_history.json before being selected.")

          echo "ISSUE1_URL=$ISSUE1_URL" >> "$GITHUB_ENV"

      # ============================================================
      # 10. COMMENT ISSUE #1
      # ============================================================

      - name: Comment Issue 1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh issue comment "$ISSUE1_URL" \
            --repo "${{ github.repository }}" \
            --body "Quote verification completed. Selected quote ID: ${SELECTED_QUOTE_ID}. The quote was checked against quote_history.json before this change."

      # ============================================================
      # 11. PREPARE PR #1
      # ============================================================

      - name: Prepare PR 1
        run: |
          git add "$HISTORY_FILE"

          git commit \
            -m "chore: record quote rotation"

          git push \
            origin "$DATA_BRANCH"

      # ============================================================
      # 12. CREATE PR #1
      # ============================================================

      - name: Create PR 1
        id: pr1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          PR1_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "$DATA_BRANCH" \
            --base "$TARGET_BRANCH" \
            --title "chore: record verified quote rotation" \
            --body "Records the next unused quote in quote_history.json. Selected quote: ${SELECTED_QUOTE_ID}. Quote database and quote history were validated.")

          echo "PR1_URL=$PR1_URL" >> "$GITHUB_ENV"

      # ============================================================
      # 13. COMMENT PR #1
      # ============================================================

      - name: Comment PR 1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh pr comment "$PR1_URL" \
            --repo "${{ github.repository }}" \
            --body "Verification passed. Selected quote: ${SELECTED_QUOTE_ID}. The selected quote was not previously present in quote_history.json. Waiting 20 seconds before merge."

      # ============================================================
      # 14. WAIT BEFORE PR #1 MERGE
      # ============================================================

      - name: Wait before PR 1 merge
        run: |
          sleep 20

      # ============================================================
      # 15. MERGE PR #1
      # ============================================================

      - name: Merge PR 1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh pr merge "$PR1_URL" \
            --merge \
            --delete-branch=false

      # ============================================================
      # 16. CLOSE ISSUE #1
      # ============================================================

      - name: Close Issue 1
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh issue close "$ISSUE1_URL" \
            --repo "${{ github.repository }}" \
            --comment "PR #1 was merged successfully. Quote rotation data update completed."

      # ============================================================
      # 17. SYNC MAIN AFTER PR #1
      # ============================================================

      - name: Sync main after PR 1
        run: |
          git fetch origin main

          git checkout main

          git reset --hard origin/main

      # ============================================================
      # 18. CREATE PAGE BRANCH
      # ============================================================

      - name: Create page branch
        run: |
          PAGE_BRANCH="automation/quote-page-${{ github.run_id }}"

          echo "PAGE_BRANCH=$PAGE_BRANCH" >> "$GITHUB_ENV"

          git checkout -B "$PAGE_BRANCH" "origin/main"

      # ============================================================
      # 19. CREATE ISSUE #2
      # ============================================================

      - name: Create Issue 2
        id: issue2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          ISSUE2_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Update ClassCrew daily quote board - run ${{ github.run_number }}" \
            --body "Update Outlook Files/index.html with the verified quote ${SELECTED_QUOTE_ID}. The page must retain the blackboard design, admin information, update time, and 12-hour countdown.")

          echo "ISSUE2_URL=$ISSUE2_URL" >> "$GITHUB_ENV"

      # ============================================================
      # 20. COMMENT ISSUE #2
      # ============================================================

      - name: Comment Issue 2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh issue comment "$ISSUE2_URL" \
            --repo "${{ github.repository }}" \
            --body "The quote passed the duplicate-use check. Selected quote ID: ${SELECTED_QUOTE_ID}. The next PR will update Outlook Files/index.html."

      # ============================================================
      # 21. UPDATE HTML PAGE
      # ============================================================

      - name: Update quote board
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          page = Path(
              "Outlook Files/index.html"
          )

          selected = json.loads(
              Path(
                  "/tmp/selected_quote.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          html = page.read_text(
              encoding="utf-8"
          )

          quote = json.dumps(
              selected["quote"],
              ensure_ascii=False
          )

          source = json.dumps(
              selected["source"],
              ensure_ascii=False
          )

          quote_id = json.dumps(
              selected["id"]
          )

          updated_at = json.dumps(
              selected["used_at"]
          )

          replacements = {
              "CURRENT_QUOTE": quote,
              "CURRENT_SOURCE": source,
              "CURRENT_QUOTE_ID": quote_id,
              "CURRENT_UPDATED_AT": updated_at
          }

          for key, value in replacements.items():

              pattern = rf"const {key} = .*?;"

              if not re.search(
                  pattern,
                  html
              ):
                  raise SystemExit(
                      f"Missing HTML marker: {key}"
                  )

              html = re.sub(
                  pattern,
                  f"const {key} = {value};",
                  html,
                  count=1
              )

          page.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "Quote board updated successfully."
          )
          PY

      # ============================================================
      # 22. VALIDATE HTML
      # ============================================================

      - name: Validate quote board
        run: |
          test -f "$PAGE_FILE"

          grep -q "CURRENT_QUOTE" "$PAGE_FILE"
          grep -q "CURRENT_SOURCE" "$PAGE_FILE"
          grep -q "CURRENT_QUOTE_ID" "$PAGE_FILE"
          grep -q "CURRENT_UPDATED_AT" "$PAGE_FILE"

          echo "Quote board validation passed."

      # ============================================================
      # 23. PREPARE PR #2
      # ============================================================

      - name: Prepare PR 2
        run: |
          git add "$PAGE_FILE"

          git commit \
            -m "feat: update ClassCrew quote board"

          git push \
            origin "$PAGE_BRANCH"

      # ============================================================
      # 24. CREATE PR #2
      # ============================================================

      - name: Create PR 2
        id: pr2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          PR2_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "$PAGE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --title "feat: update ClassCrew quote board" \
            --body "Updates Outlook Files/index.html with the verified quote ${SELECTED_QUOTE_ID}. The page retains the blackboard design, admin attribution, update time, and 12-hour countdown.")

          echo "PR2_URL=$PR2_URL" >> "$GITHUB_ENV"

      # ============================================================
      # 25. COMMENT PR #2
      # ============================================================

      - name: Comment PR 2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh pr comment "$PR2_URL" \
            --repo "${{ github.repository }}" \
            --body "Quote board verification passed. Selected quote: ${SELECTED_QUOTE_ID}. The page now references the verified quote selected by the automation. Waiting 20 seconds before merge."

      # ============================================================
      # 26. WAIT BEFORE PR #2 MERGE
      # ============================================================

      - name: Wait before PR 2 merge
        run: |
          sleep 20

      # ============================================================
      # 27. MERGE PR #2
      # ============================================================

      - name: Merge PR 2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh pr merge "$PR2_URL" \
            --merge \
            --delete-branch=false

      # ============================================================
      # 28. CLOSE ISSUE #2
      # ============================================================

      - name: Close Issue 2
        env:
          GH_TOKEN: ${{ secrets.AVIRAJ_PAT }}
        run: |
          gh issue close "$ISSUE2_URL" \
            --repo "${{ github.repository }}" \
            --comment "PR #2 was merged successfully. ClassCrew quote board update completed."

      # ============================================================
      # 29. FINAL SUMMARY
      # ============================================================

      - name: Execution summary
        run: |
          echo "=========================================="
          echo "CLASSCREW QUOTE AUTOMATION COMPLETE"
          echo "=========================================="
          echo ""
          echo "Execution: #${{ github.run_number }}"
          echo "Selected quote: ${SELECTED_QUOTE_ID}"
          echo ""
          echo "Issues created:       2"
          echo "Issue comments:       2"
          echo "Pull requests:        2"
          echo "PR comments:          2"
          echo "PR merges:            2"
          echo "Issues closed:        2"
          echo ""
          echo "Quote rotation:       Every 12 hours"
          echo "Duplicate checking:   ENABLED"
          echo "Quote history:        ENABLED"
          echo "Admin:                Aviraj Salunkhe"
          echo ""
          echo "=========================================="
