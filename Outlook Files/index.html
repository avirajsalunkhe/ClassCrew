<body>

<main class="page">

    <header class="heading">
        <div class="eyebrow">ClassCrew • Learning Board</div>
        <h1>Today's Thought</h1>
        <p>A new thought is placed on the board every 12 hours.</p>
    </header>

    <section class="board-frame">

        <div class="board">

            <div class="board-top">
                <div class="school-label">✦ Knowledge • Practice • Growth</div>
                <div class="status">● LIVE BOARD</div>
            </div>

            <section class="quote-area">

                <span class="quote-mark">“</span>

                <div
                    id="quote"
                    class="quote"
                    aria-live="polite"
                ></div>

                <div
                    id="author"
                    class="author"
                ></div>

                <div class="divider"></div>

                <div class="meta-grid">

                    <div class="meta-card">
                        <span class="meta-label">Updated At</span>
                        <span
                            id="updatedAt"
                            class="meta-value"
                        ></span>
                    </div>

                    <div class="meta-card">
                        <span class="meta-label">Next Quote In</span>
                        <span
                            id="countdown"
                            class="meta-value countdown"
                        ></span>
                    </div>

                    <div class="meta-card">
                        <span class="meta-label">Cycle</span>
                        <span
                            id="cycleTime"
                            class="meta-value"
                        ></span>
                    </div>

                </div>

            </section>

            <div class="board-bottom">

                <div
                    id="quoteCounter"
                    class="quote-counter"
                ></div>

                <div class="progress-wrap">
                    <div class="progress">
                        <div
                            id="progressBar"
                            class="progress-bar"
                        ></div>
                    </div>
                </div>

            </div>

        </div>

    </section>

    <div class="footer-note">
        Curated and maintained by
        <a
            href="https://github.com/avirajsalunkhe"
            target="_blank"
            rel="noopener noreferrer"
            style="color:inherit;"
        >
            Aviraj Salunkhe
        </a>
    </div>

</main>
<script>
    const QUOTES_FILE = "../php_auth_system/data/daily_quotes.json";

    const CYCLE_MS = 12 * 60 * 60 * 1000;

    const quoteElement =
        document.getElementById("quote");

    const authorElement =
        document.getElementById("author");

    const updatedAtElement =
        document.getElementById("updatedAt");

    const countdownElement =
        document.getElementById("countdown");

    const cycleTimeElement =
        document.getElementById("cycleTime");

    const quoteCounterElement =
        document.getElementById("quoteCounter");

    const progressBarElement =
        document.getElementById("progressBar");

    let quotes = [];
    let currentIndex = -1;

    async function loadQuotes() {
        try {
            const response =
                await fetch(`${QUOTES_FILE}?v=${Date.now()}`);

            if (!response.ok) {
                throw new Error(
                    `Unable to load quotes: ${response.status}`
                );
            }

            quotes = await response.json();

            if (!Array.isArray(quotes) || quotes.length === 0) {
                throw new Error("Quote database is empty.");
            }

            updateBoard(true);
            updateCountdown();

        } catch (error) {

            console.error(error);

            quoteElement.textContent =
                "Unable to load today's thought.";

            authorElement.textContent =
                "— ClassCrew";
        }
    }

    function getCycleStart(now = new Date()) {
        return (
            Math.floor(now.getTime() / CYCLE_MS) *
            CYCLE_MS
        );
    }

    function getCycleIndex(now = new Date()) {

        const cycleNumber =
            Math.floor(now.getTime() / CYCLE_MS);

        return cycleNumber % quotes.length;
    }

    function formatDateTime(timestamp) {

        return new Intl.DateTimeFormat(
            undefined,
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        ).format(new Date(timestamp));
    }

    function formatCountdown(milliseconds) {

        const totalSeconds =
            Math.max(
                0,
                Math.floor(milliseconds / 1000)
            );

        const hours =
            Math.floor(totalSeconds / 3600);

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
        );
    }

    function updateBoard(force = false) {

        if (!quotes.length) {
            return;
        }

        const now = new Date();

        const index =
            getCycleIndex(now);

        if (!force && index === currentIndex) {
            return;
        }

        currentIndex = index;

        const selectedQuote =
            quotes[index];

        quoteElement.classList.add(
            "fade-out"
        );

        setTimeout(() => {

            quoteElement.textContent =
                selectedQuote.quote;

            authorElement.innerHTML =
                `— Admin:
                <a
                    href="https://github.com/avirajsalunkhe"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Aviraj Salunkhe
                </a>`;

            quoteElement.classList.remove(
                "fade-out"
            );

        }, 180);

        const cycleStart =
            getCycleStart(now);

        const nextUpdate =
            cycleStart + CYCLE_MS;

        updatedAtElement.textContent =
            formatDateTime(cycleStart);

        cycleTimeElement.textContent =
            formatDateTime(nextUpdate);

        quoteCounterElement.textContent =
            `Quote ${index + 1} of ${quotes.length}`;

        const progress =
            ((index + 1) / quotes.length) * 100;

        progressBarElement.style.width =
            `${progress}%`;
    }

    function updateCountdown() {

        if (!quotes.length) {
            return;
        }

        const now =
            new Date();

        const cycleStart =
            getCycleStart(now);

        const nextUpdate =
            cycleStart + CYCLE_MS;

        const remaining =
            nextUpdate - now.getTime();

        countdownElement.textContent =
            formatCountdown(remaining);

        updateBoard(false);
    }

    loadQuotes();

    setInterval(
        updateCountdown,
        1000
    );

    document.addEventListener(
        "visibilitychange",
        () => {

            if (!document.hidden) {
                updateBoard(true);
                updateCountdown();
            }
        }
    );
</script>
</body>
</html>
